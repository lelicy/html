<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <!-- RWD -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>今天很開心喔 👶</title>

  <style>
    /* =========================
       基礎設定
    ========================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "PingFang TC",
        "Helvetica Neue",
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 50% 40%,
          #fffdf8 0%,
          #fff5f8 45%,
          #f7f0ff 100%
        );

      overflow: hidden;
    }


    /* =========================
       主容器
    ========================== */

    .container {
      position: relative;
      width: 100%;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }


    /* =========================
       背景 Emoji
    ========================== */

    .emoji {
      position: absolute;
      font-size: 42px;
      user-select: none;
      pointer-events: none;

      animation: float 4s ease-in-out infinite;
    }

    .emoji-1 {
      top: 18%;
      left: 15%;
      animation-delay: 0s;
    }

    .emoji-2 {
      top: 25%;
      right: 15%;
      animation-delay: 1s;
    }

    .emoji-3 {
      bottom: 18%;
      left: 20%;
      animation-delay: 1.5s;
    }

    .emoji-4 {
      bottom: 22%;
      right: 20%;
      animation-delay: 2s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) rotate(-5deg);
      }

      50% {
        transform: translateY(-12px) rotate(5deg);
      }
    }


    /* =========================
       中央按鈕
    ========================== */

    .happy-button {
      position: relative;
      z-index: 10;

      border: none;
      outline: none;

      padding: 18px 34px;

      border-radius: 999px;

      background: rgba(255, 255, 255, 0.9);

      color: #333;

      font-size: 18px;
      font-weight: 600;

      cursor: pointer;

      box-shadow:
        0 10px 30px rgba(120, 100, 150, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);

      backdrop-filter: blur(12px);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .happy-button:hover {
      transform: translateY(-4px) scale(1.03);

      box-shadow:
        0 16px 35px rgba(120, 100, 150, 0.18);
    }

    .happy-button:active {
      transform: scale(0.94);
    }


    /* =========================
       結果文字
    ========================== */

    .message {
      position: absolute;
      z-index: 20;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%)
        scale(0);

      opacity: 0;

      white-space: nowrap;

      font-size: clamp(30px, 6vw, 64px);
      font-weight: 700;

      color: #333;

      text-shadow:
        0 5px 15px rgba(0, 0, 0, 0.08);

      pointer-events: none;
    }

    .message.show {
      animation: messagePop 0.8s
        cubic-bezier(.17, .89, .32, 1.49)
        forwards;
    }

    @keyframes messagePop {

      0% {
        transform:
          translate(-50%, -50%)
          scale(0);
        opacity: 0;
      }

      60% {
        transform:
          translate(-50%, -50%)
          scale(1.15);
        opacity: 1;
      }

      100% {
        transform:
          translate(-50%, -50%)
          scale(1);
        opacity: 1;
      }
    }


    /* =========================
       彩帶
    ========================== */

    .confetti {
      position: fixed;

      top: -20px;

      width: 10px;
      height: 18px;

      opacity: 0;

      pointer-events: none;

      animation:
        confettiFall 2.8s linear forwards;
    }

    @keyframes confettiFall {

      0% {
        transform:
          translateY(-20px)
          rotate(0deg);
        opacity: 1;
      }

      100% {
        transform:
          translateY(110vh)
          rotate(720deg);
        opacity: 0;
      }
    }


    /* =========================
       小手機優化
    ========================== */

    @media (max-width: 480px) {

      .happy-button {
        padding: 16px 28px;
        font-size: 16px;
      }

      .emoji {
        font-size: 32px;
      }

      .emoji-1 {
        left: 8%;
      }

      .emoji-2 {
        right: 8%;
      }

      .emoji-3 {
        left: 10%;
      }

      .emoji-4 {
        right: 10%;
      }
    }

  </style>
</head>


<body>

  <main class="container">

    <!-- 背景 Emoji -->
    <div class="emoji emoji-1">🍎</div>
    <div class="emoji emoji-2">🫧</div>
    <div class="emoji emoji-3">🌸</div>
    <div class="emoji emoji-4">✨</div>


    <!-- 中央按鈕 -->
    <button
      class="happy-button"
      id="happyButton"
      type="button"
    >
      點我一下 ♡
    </button>


    <!-- 成功文字 -->
    <div
      class="message"
      id="message"
    >
      今天很開心喔👶
    </div>

  </main>


  <script>

    const button = document.getElementById("happyButton");
    const message = document.getElementById("message");


    /*
      建立彩帶
    */
    function createConfetti() {

      const confettiCount = 100;

      for (let i = 0; i < confettiCount; i++) {

        const confetti =
          document.createElement("div");

        confetti.classList.add("confetti");


        /*
          隨機位置
        */
        confetti.style.left =
          Math.random() * 100 + "vw";


        /*
          Apple Emoji 感的柔和色系
        */
        const colors = [
          "#FF9AA2",
          "#FFB7B2",
          "#FFDAC1",
          "#E2F0CB",
          "#B5EAD7",
          "#C7CEEA",
          "#D7BDE2"
        ];

        confetti.style.background =
          colors[
            Math.floor(
              Math.random() * colors.length
            )
          ];


        /*
          隨機尺寸
        */
        const size =
          Math.random() * 8 + 6;

        confetti.style.width =
          size + "px";

        confetti.style.height =
          size * 1.6 + "px";


        /*
          隨機動畫速度
        */
        confetti.style.animationDuration =
          (Math.random() * 1.5 + 2) + "s";


        /*
          隨機延遲
        */
        confetti.style.animationDelay =
          Math.random() * 0.4 + "s";


        /*
          圓角
        */
        confetti.style.borderRadius =
          Math.random() > 0.5
            ? "50%"
            : "3px";


        document.body.appendChild(confetti);


        /*
          動畫結束後刪除
        */
        setTimeout(() => {

          confetti.remove();

        }, 3500);

      }
    }


    /*
      按鈕點擊
    */
    button.addEventListener("click", () => {

      /*
        隱藏按鈕
      */
      button.style.opacity = "0";
      button.style.pointerEvents = "none";


      /*
        顯示文字
      */
      message.classList.remove("show");

      /*
        強制瀏覽器重新計算動畫
      */
      void message.offsetWidth;

      message.classList.add("show");


      /*
        彩帶
      */
      createConfetti();

    });

  </script>

</body>
</html>
